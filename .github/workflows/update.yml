name: Update data and publish
on:
  schedule:
    - cron: '13 4 * * *'    # about 11 PM Eastern
    - cron: '13 12 * * *'   # about 7 AM Eastern
    - cron: '13 16 * * *'   # about 11 AM Eastern
    - cron: '13 20 * * *'   # about 3 PM Eastern
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'template.html', '.github/workflows/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update ratings and scores
        run: python scripts/update.py
      - name: Build the page
        run: python scripts/build.py
      - name: Save the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update data" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
